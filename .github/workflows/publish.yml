name: Publish GHCR image

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Native package channel
        type: choice
        options: [stable, testing]
        default: stable
      slot:
        description: Server slot (for example 7)
        required: true
        type: string
      exact_version:
        description: Full native version (for example 1:7.1-1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ghcr-publish
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/build-test.yml # zizmor: ignore[self-repository] -- test the workflow from this checkout
    with:
      channel: ${{ inputs.channel }}
      slot: ${{ inputs.slot }}
      exact_version: ${{ inputs.exact_version }}
      save_images: true
  publish:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*
          path: images
      - name: Verify both architectures selected the same version
        run: cmp images/image-amd64/selection.json images/image-arm64/selection.json
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish tested architectures and manifest
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          image=ghcr.io/gelstable/gel
          slot=$(jq -r .slot images/image-amd64/selection.json)
          product=$(jq -r .tag images/image-amd64/selection.json)
          newest=$(jq -r .latest_slot images/image-amd64/selection.json)
          for arch in amd64 arm64; do
            docker load -i "images/image-$arch/image.tar"
            docker tag "$image:latest" "$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch"
            docker push "$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch"
          done
          sources=("$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64" "$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64")
          tags=("$slot" "$product")
          if [[ "$CHANNEL" = stable && "$slot" = "$newest" ]]; then
            tags+=(latest)
          fi
          for tag in "${tags[@]}"; do
            docker manifest create "$image:$tag" "${sources[@]}"
            docker manifest push "$image:$tag"
          done
