name: Build and test native images

on:
  workflow_call:
    inputs:
      channel:
        type: string
        default: testing
      slot:
        type: string
        default: ''
      exact_version:
        type: string
        default: ''
      cli_version:
        type: string
        default: ''
      artifact_prefix:
        type: string
        default: image
      save_images:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GEL_TEST_CHANNEL: ${{ inputs.channel }}
      GEL_TEST_SLOT: ${{ inputs.slot }}
      GEL_TEST_CLI_VERSION: ${{ inputs.cli_version }}
      GEL_TEST_EXACT_VERSION: ${{ inputs.exact_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq parallel python3-debian shellcheck curl uuid-runtime
      - name: Test image reconciliation plan
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Select and build native image
        run: |
          source tests/testbase.bash
          latest_server_ver > selection.json
          export GEL_TEST_SLOT=$(jq -r .slot selection.json)
          export GEL_TEST_EXACT_VERSION=$(jq -r .version selection.json)
          echo "GEL_TEST_SLOT=$GEL_TEST_SLOT" >> "$GITHUB_ENV"
          build_container
      - name: Use the packaged CLI for tests
        run: |
          container=$(docker create ghcr.io/gelstable/gel:latest)
          docker cp "$container:/usr/bin/gel" ./gel
          docker rm "$container"
          sudo install -m755 ./gel /usr/local/bin/gel
      - name: Test image behavior
        env:
          GEL_TEST_IMAGE_READY: '1'
        run: bats tests/*.bats
      - name: Check shell scripts
        run: |
          shellcheck docker-entrypoint.sh docker-entrypoint-funcs.sh show-secrets.sh
          shellcheck tests/testbase.bash
      - name: Save tested image
        if: inputs.save_images
        run: docker save -o image.tar ghcr.io/gelstable/gel:latest
      - name: Retain tested image
        if: inputs.save_images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.arch }}
          path: |
            image.tar
            selection.json
          retention-days: 1
