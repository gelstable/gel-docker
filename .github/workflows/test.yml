name: Run tests

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [master, ci]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/build-test.yml # zizmor: ignore[self-repository] -- test the workflow from this checkout
    with:
      channel: testing
